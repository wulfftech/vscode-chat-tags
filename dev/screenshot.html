<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Tags</title>
<style>
/* SPDX-License-Identifier: GPL-3.0-or-later
   Copyright (C) 2026 WulffTech */

/* row height matches the built-in chat sessions list (ITEM_HEIGHT = 54) so the two
   views sit side by side without looking like different products */

:root {
	--row-height: 54px;
	--stripe-width: 3px;
	/* resting rows sit high enough to read the colour at a glance; attention rows get
	   the remaining headroom plus the left border, so the border means one thing only */
	--wash-rest: 22%;
	--wash-hover: 30%;
	--wash-attention: 42%;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	padding: 0;
	font-family: var(--vscode-font-family);
	font-size: var(--vscode-font-size);
	color: var(--vscode-foreground);
	background: transparent;
	user-select: none;
}

button {
	font-family: inherit;
	color: inherit;
	background: none;
	border: none;
	cursor: pointer;
}

.toolbar {
	display: flex;
	gap: 4px;
	align-items: center;
	padding: 5px 8px;
	position: sticky;
	top: 0;
	z-index: 3;
	background: var(--vscode-sideBar-background, transparent);
	border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, transparent);
}

.toolbar button {
	font-size: 11px;
	border-radius: 4px;
	padding: 3px 7px;
	opacity: 0.85;
}

.toolbar button:hover {
	background: var(--vscode-list-hoverBackground);
	opacity: 1;
}

.toolbar button.active {
	background: var(--vscode-list-activeSelectionBackground);
	color: var(--vscode-list-activeSelectionForeground);
	opacity: 1;
}

.toolbar .spacer {
	flex: 1;
}

.count {
	font-size: 11px;
	color: var(--vscode-descriptionForeground);
}

.list {
	list-style: none;
	margin: 0;
	padding: 0;
}

.row {
	position: relative;
	height: var(--row-height);
	padding: 8px 10px 8px 14px;
	display: grid;
	grid-template-rows: auto auto;
	align-content: center;
	gap: 2px;
	cursor: pointer;
	border-left: var(--stripe-width) solid transparent;
	outline: none;
}

.row[data-category] {
	background: color-mix(in srgb, var(--row-colour) var(--wash-rest), transparent);
}

.row:hover {
	background: var(--vscode-list-hoverBackground);
}

.row[data-category]:hover {
	background: color-mix(in srgb, var(--row-colour) var(--wash-hover), var(--vscode-list-hoverBackground));
}

/* the one signal that means "this wants you": full-strength wash, the left border,
   and a heavier title. nothing else in the view uses the border */
.row[data-attention="true"] {
	border-left-color: var(--row-colour, var(--vscode-focusBorder));
}

.row[data-attention="true"][data-category] {
	background: color-mix(in srgb, var(--row-colour) var(--wash-attention), transparent);
}

.row[data-attention="true"] .title {
	font-weight: 600;
}

.row.selected {
	background: var(--vscode-list-activeSelectionBackground);
	color: var(--vscode-list-activeSelectionForeground);
}

.row:focus-visible {
	outline: 1px solid var(--vscode-focusBorder);
	outline-offset: -1px;
}

.line {
	display: flex;
	align-items: center;
	gap: 6px;
	min-width: 0;
}

.dot {
	flex: 0 0 auto;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--dot-colour, var(--vscode-descriptionForeground));
}

/* activity reads as intensity rather than hue, so category colour stays the signal
   for "what is this" and brightness stays the signal for "is it moving" */
.row[data-state="idle"] .dot { opacity: 0.7; }
.row[data-state="recent"] .dot { opacity: 0.88; }
.row[data-state="active"] .dot { opacity: 1; }
.row[data-attention="true"] .dot {
	opacity: 1;
	box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-colour, var(--vscode-focusBorder)) 30%, transparent);
}

/* a chat mid-answer gets the one channel nothing else in this view uses: movement. it
   deliberately does not get intensity, because intensity means "this wants you" and a
   session that is busy is the exact thing that shouldn't be saying it.
   the disc hollows out to a ring as well, so the state still reads with motion off */
.row[data-turn="working"] .dot {
	background: transparent;
	box-shadow: inset 0 0 0 2px var(--dot-colour, var(--vscode-descriptionForeground));
	animation: working 1.6s ease-in-out infinite;
}

@keyframes working {
	0%, 100% { opacity: 0.4; transform: scale(0.78); }
	50% { opacity: 1; transform: scale(1.1); }
}

/* the ring is the fallback signal, so it stays; only the movement goes */
@media (prefers-reduced-motion: reduce) {
	.row[data-turn="working"] .dot,
	.subtitle.generating {
		animation: none;
	}
	.row[data-turn="working"] .dot { opacity: 1; }
}

.title {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: 13px;
}

/* permission pill — only drawn when a session is off the default level, so it reads as
   an exception rather than a label every row carries. flex-none so the title ellipsises
   into it rather than the pill being squeezed out of a narrow sidebar */
.pill {
	flex: 0 0 auto;
	font-size: 9px;
	line-height: 1;
	padding: 2px 5px;
	border-radius: 8px;
	letter-spacing: 0.02em;
	text-transform: uppercase;
	white-space: nowrap;
	color: var(--vscode-descriptionForeground);
	box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--vscode-descriptionForeground) 40%, transparent);
}

/* autoApprove and autopilot are what the workbench itself calls elevated — this is the
   one thing in the list worth borrowing the warning colours for */
.pill[data-elevated="true"] {
	color: var(--vscode-inputValidation-warningForeground, var(--vscode-foreground));
	background: var(--vscode-inputValidation-warningBackground, var(--vscode-list-hoverBackground));
	box-shadow: inset 0 0 0 1px var(--vscode-inputValidation-warningBorder, var(--vscode-focusBorder));
}

/* both of these are a state rather than a setting, so they take the same amber and turn
   the weight up. intensity is already this view's urgency axis, and a second colour would
   collide with the danger red that the delete action owns */
.pill[data-live="true"],
.pill[data-wants="true"] {
	font-weight: 600;
}

/* the leading dot belongs to the live auto-approval reading alone. Needs input goes
   without one, because two amber pills carrying the same mark read as one thing */
.pill[data-live="true"]::before {
	content: "";
	display: inline-block;
	width: 5px;
	height: 5px;
	margin-right: 4px;
	border-radius: 50%;
	background: currentColor;
}

/* an archived row is put away — its pill should not keep shouting from the bottom section */
.row.archived .pill {
	opacity: 0.5;
}

.subtitle-line {
	display: flex;
	align-items: center;
	gap: 4px;
	padding-left: 14px;
	min-width: 0;
}

.subtitle {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: 11px;
	color: var(--vscode-descriptionForeground);
}

/* the subtitle text is no longer a click target — editing needs the pencil, so
   clicking anywhere on the row reliably opens the session */
.edit {
	flex: 0 0 auto;
	opacity: 0;
	font-size: 11px;
	line-height: 1;
	padding: 1px 3px;
	border-radius: 3px;
	color: var(--vscode-descriptionForeground);
}

.row:hover .edit,
.row:focus-within .edit {
	opacity: 0.75;
}

.edit:hover {
	opacity: 1;
	color: var(--vscode-foreground);
	background: var(--vscode-list-hoverBackground);
}

.subtitle.placeholder {
	opacity: 0.65;
	font-style: italic;
}

.row-input {
	flex: 1;
	min-width: 0;
	font-family: inherit;
	font-size: 11px;
	color: var(--vscode-input-foreground, var(--vscode-foreground));
	background: var(--vscode-input-background, transparent);
	border: 1px solid var(--vscode-focusBorder);
	border-radius: 3px;
	padding: 1px 4px;
	outline: none;
}

/* ── in-pane panels ───────────────────────────────────────── */

.panel {
	border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, transparent);
	background: var(--vscode-sideBar-background, transparent);
	padding: 8px;
}

.panel h2 {
	margin: 0 0 6px;
	font-size: 11px;
	text-transform: uppercase;
	letter-spacing: 0.06em;
	color: var(--vscode-descriptionForeground);
	font-weight: 600;
}

.cat-row {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 3px 0;
}

.cat-row .grip {
	flex: 0 0 auto;
	display: flex;
	align-items: center;
	padding: 0;
	opacity: 0.45;
	color: var(--vscode-descriptionForeground);
	cursor: grab;
	/* or a drag on a touchpad or pen gets taken as a scroll and the capture never starts */
	touch-action: none;
}

.cat-row .grip:hover {
	opacity: 1;
}

/* the same ring rows and group headings get — this is a keyboard control as much as a
   pointer one, and at 13px there is nothing else to see it by */
.cat-row .grip:focus-visible {
	opacity: 1;
	outline: 1px solid var(--vscode-focusBorder);
	outline-offset: 1px;
	border-radius: 2px;
}

/* the row stays where it is and dims rather than following the pointer — in a pane this
   narrow the drop line is the thing worth watching, and a floating copy would cover it */
.cat-row.dragging {
	opacity: 0.4;
}

.cat-row.dragging .grip {
	cursor: grabbing;
	opacity: 1;
}

/* drawn inside the row it belongs to, so it stays put if the list scrolls under it */
.cat-row[data-drop="before"] {
	box-shadow: inset 0 2px 0 0 var(--vscode-focusBorder);
}

.cat-row[data-drop="after"] {
	box-shadow: inset 0 -2px 0 0 var(--vscode-focusBorder);
}

.cat-row input[type="color"] {
	flex: 0 0 auto;
	width: 22px;
	height: 22px;
	padding: 0;
	border: 1px solid var(--vscode-contrastBorder, transparent);
	border-radius: 4px;
	background: none;
	cursor: pointer;
}

.cat-row input[type="text"] {
	flex: 1;
	min-width: 0;
	font-family: inherit;
	font-size: 12px;
	color: var(--vscode-input-foreground, var(--vscode-foreground));
	background: var(--vscode-input-background, transparent);
	border: 1px solid var(--vscode-input-border, transparent);
	border-radius: 3px;
	padding: 3px 6px;
	outline: none;
}

.cat-row input[type="text"]:focus {
	border-color: var(--vscode-focusBorder);
}

.cat-row .remove {
	flex: 0 0 auto;
	opacity: 0.6;
	font-size: 13px;
	padding: 0 4px;
}

.cat-row .remove:hover {
	opacity: 1;
	color: var(--vscode-errorForeground, inherit);
}

.panel .add {
	font-size: 11px;
	margin-top: 6px;
	padding: 3px 7px;
	border-radius: 4px;
	border: 1px dashed var(--vscode-descriptionForeground);
	opacity: 0.8;
}

.panel .add:hover {
	opacity: 1;
	background: var(--vscode-list-hoverBackground);
}

.panel .hint {
	font-size: 11px;
	color: var(--vscode-descriptionForeground);
	margin-top: 6px;
	line-height: 1.4;
}

.section {
	margin-top: 12px;
	padding-top: 8px;
	border-top: 1px solid var(--vscode-sideBarSectionHeader-border, transparent);
}

.opt-row {
	display: flex;
	align-items: flex-start;
	gap: 7px;
	width: 100%;
	text-align: left;
	padding: 4px 5px;
	border-radius: 4px;
}

.opt-row:hover {
	background: var(--vscode-list-hoverBackground);
}

.opt-row.chosen .opt-label {
	font-weight: 600;
}

.opt-row .radio {
	flex: 0 0 auto;
	font-size: 10px;
	line-height: 15px;
	opacity: 0.8;
}

.opt-text {
	display: flex;
	flex-direction: column;
	min-width: 0;
}

.opt-label {
	font-size: 12px;
}

.opt-hint {
	font-size: 10px;
	color: var(--vscode-descriptionForeground);
	line-height: 1.35;
}

.field {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 4px 5px;
}

.field-label {
	flex: 1;
	font-size: 12px;
	min-width: 0;
}

/* the slider needs the room, so its label gives up the flex share */
.field-label.narrow {
	flex: 0 0 auto;
}

.field-suffix {
	flex: 0 0 auto;
	font-size: 10px;
	color: var(--vscode-descriptionForeground);
	min-width: 26px;
}

.field input[type="number"] {
	flex: 0 0 auto;
	width: 52px;
	font-family: inherit;
	font-size: 12px;
	color: var(--vscode-input-foreground, var(--vscode-foreground));
	background: var(--vscode-input-background, transparent);
	border: 1px solid var(--vscode-input-border, transparent);
	border-radius: 3px;
	padding: 2px 5px;
	outline: none;
}

.field input[type="number"]:focus {
	border-color: var(--vscode-focusBorder);
}

.field input[type="range"] {
	flex: 1 1 auto;
	min-width: 0;
	accent-color: var(--vscode-focusBorder);
}

/* ── dragging a chat into another group ──────────────────────────────────── */

.row.dragging {
	opacity: 0.4;
}

/* the tint is an overlay rather than a background, because a row's background is already
   carrying its category wash, its hover state or its selection — and the drop target has
   to read the same on all of them */
.group[data-drop-into]::after,
.row[data-drop-into]::after {
	content: '';
	position: absolute;
	inset: 0;
	pointer-events: none;
	background: color-mix(in srgb, var(--vscode-focusBorder) 12%, transparent);
}

/* the heading is the half that names where the chat is going, so it takes the outline
   and the stronger tint; its rows only have to read as belonging to it */
.group[data-drop-into] {
	color: var(--vscode-foreground);
}

.group[data-drop-into]::after {
	background: color-mix(in srgb, var(--vscode-focusBorder) 26%, transparent);
	box-shadow: inset 0 0 0 1px var(--vscode-focusBorder);
}

/* what the pointer is carrying. the row it came from can be scrolled out of sight by the
   time it lands, and a dimmed row you cannot see says nothing */
.drag-chip {
	position: fixed;
	top: 0;
	left: 0;
	z-index: 9;
	max-width: 200px;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
	padding: 3px 8px;
	border-radius: 4px;
	font-size: 11px;
	pointer-events: none;
	color: var(--vscode-foreground);
	background: var(--vscode-sideBar-background, var(--vscode-editor-background));
	box-shadow: inset 0 0 0 1px var(--vscode-focusBorder), 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* category assignment popover, anchored under the row's ⋯ button */
.popover {
	position: absolute;
	z-index: 10;
	min-width: 150px;
	padding: 4px;
	border-radius: 5px;
	background: var(--vscode-menu-background, var(--vscode-sideBar-background));
	color: var(--vscode-menu-foreground, var(--vscode-foreground));
	border: 1px solid var(--vscode-menu-border, var(--vscode-contrastBorder, transparent));
	box-shadow: 0 3px 10px rgba(0, 0, 0, 0.36);
}

.popover button {
	display: flex;
	align-items: center;
	gap: 7px;
	width: 100%;
	text-align: left;
	font-size: 12px;
	padding: 4px 6px;
	border-radius: 3px;
}

.popover button:hover {
	background: var(--vscode-menu-selectionBackground, var(--vscode-list-hoverBackground));
	color: var(--vscode-menu-selectionForeground, inherit);
}

.popover .swatch {
	flex: 0 0 auto;
	width: 10px;
	height: 10px;
	border-radius: 50%;
	background: var(--swatch, transparent);
	border: 1px solid var(--vscode-descriptionForeground);
}

.popover .sep {
	height: 1px;
	margin: 4px 2px;
	background: var(--vscode-menu-separatorBackground, var(--vscode-sideBarSectionHeader-border, transparent));
}

.empty {
	padding: 16px 12px;
	font-size: 12px;
	color: var(--vscode-descriptionForeground);
	line-height: 1.5;
}

.subtitle.generating {
	opacity: 0.7;
	font-style: italic;
	animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
	0%, 100% { opacity: 0.45; }
	50% { opacity: 0.85; }
}

.field.toggle {
	gap: 6px;
}

.field.toggle input[type="checkbox"] {
	flex: 0 0 auto;
	margin: 0;
	accent-color: var(--vscode-focusBorder);
}

.field.toggle label {
	font-size: 11px;
	color: var(--vscode-foreground);
	cursor: pointer;
}

.toolbar button.icon {
	flex: 0 0 auto;
	width: 22px;
	padding: 3px 0;
	font-size: 13px;
	line-height: 1;
	text-align: center;
}

/* the settings panel leads with a section, which would otherwise draw a rule under the
   toolbar's own border */
.panel > .section:first-child {
	margin-top: 0;
	padding-top: 0;
	border-top: none;
}

.panel .sub-label {
	font-size: 11px;
	color: var(--vscode-descriptionForeground);
	margin: 2px 0 4px;
	opacity: 0.85;
}

/* a renamed session gets a hairline under the title — enough to notice, not enough to
   compete with the attention border */
.title[data-overridden="true"] {
	text-decoration: underline;
	text-decoration-style: dotted;
	text-decoration-color: var(--vscode-descriptionForeground);
	text-underline-offset: 3px;
}

/* ── row buttons ────────────────────────────────────────── */

/* the controls collapse to nothing when the row isn't hovered. they used to hold their
   width while invisible, which cost the title about 60px of every row for no reason */
.row-actions {
	flex: 0 0 auto;
	display: flex;
	align-items: center;
	gap: 2px;
	width: 0;
	overflow: hidden;
}

.row:hover .row-actions,
.row:focus-within .row-actions,
.row-actions.has-armed {
	width: auto;
	overflow: visible;
}

.gen {
	flex: 0 0 auto;
	opacity: 0;
	display: inline-flex;
	align-items: center;
	padding: 1px 3px;
	border-radius: 3px;
	color: var(--vscode-descriptionForeground);
}

.row:hover .gen,
.row:focus-within .gen {
	opacity: 0.75;
}

.gen:hover {
	opacity: 1;
	color: var(--vscode-foreground);
	background: var(--vscode-list-hoverBackground);
}

/* the field was written by hand — say so before it gets overwritten */
.row:hover .gen.guarded,
.row:focus-within .gen.guarded {
	opacity: 0.35;
}

.gen.guarded:hover {
	opacity: 0.6;
}

/* armed stays visible whether or not the row is hovered — it is a live decision */
.row .gen.armed,
.row:hover .gen.armed,
.gen.armed:hover {
	opacity: 1;
	color: var(--vscode-inputValidation-warningForeground, var(--vscode-foreground));
	background: var(--vscode-inputValidation-warningBackground, var(--vscode-list-hoverBackground));
	box-shadow: inset 0 0 0 1px var(--vscode-inputValidation-warningBorder, var(--vscode-focusBorder));
}

/* the title row's controls sit to the right of the title, same as the subtitle's */
.line .edit,
.line .gen {
	margin-left: 0;
}

.edit svg,
.gen svg,
.actions svg {
	display: block;
}

/* ── toolbar ────────────────────────────────────────────── */

.toolbar button.icon svg {
	display: block;
	margin: 0 auto;
}

.toolbar .logo {
	display: block;
	width: 15px;
	height: 15px;
	margin: 0 auto;
	/* the logo is already a finished thing — no theme tinting, just size it */
	object-fit: contain;
}

/* an open panel is closed by the same button that opened it, so the button has to
   read as pressed rather than merely hovered */
.toolbar button.active,
.toolbar button.icon.active {
	background: var(--vscode-inputOption-activeBackground, var(--vscode-list-activeSelectionBackground));
	color: var(--vscode-inputOption-activeForeground, var(--vscode-list-activeSelectionForeground));
	box-shadow: inset 0 0 0 1px var(--vscode-inputOption-activeBorder, var(--vscode-focusBorder));
	opacity: 1;
}

/* ── model picker ───────────────────────────────────────── */

.field select {
	flex: 1;
	min-width: 0;
	font-family: inherit;
	font-size: 11px;
	padding: 2px 4px;
	border-radius: 3px;
	color: var(--vscode-dropdown-foreground, var(--vscode-foreground));
	background: var(--vscode-dropdown-background, var(--vscode-input-background));
	border: 1px solid var(--vscode-dropdown-border, var(--vscode-input-border, transparent));
}

.field select:focus {
	outline: 1px solid var(--vscode-focusBorder);
	outline-offset: -1px;
}

.field.empty select {
	opacity: 0.6;
}

/* the title line runs at 13px, so its editor has to as well or the row jumps */
.title-input {
	font-size: 13px;
}

/* the title's own controls live in the same collapsing group, so the ⋯ no longer holds
   a permanent column on the right either */
.line .row-actions,
.subtitle-line .row-actions {
	margin-left: 2px;
}

.actions {
	flex: 0 0 auto;
	display: inline-flex;
	align-items: center;
	padding: 1px 3px;
	border-radius: 3px;
	opacity: 0;
	color: var(--vscode-descriptionForeground);
}

.row:hover .actions,
.row:focus-within .actions,
.row-actions.has-armed .actions {
	opacity: 0.75;
}

.actions:hover {
	opacity: 1;
	color: var(--vscode-foreground);
	background: var(--vscode-list-hoverBackground);
}

/* ── grouping ───────────────────────────────────────────── */

/* a group heading sits below the toolbar but above the rows it introduces, and never
   takes the row treatment — but unlike a row it's a single toggle, not a listbox option.
   padding-left stays 14px to match .row, so the swatch lines up with the dot beneath it;
   the chevron is positioned into that same inset rather than added to the flex flow, or
   every heading's swatch/name/count would shift right of the rows they introduce */
.group {
	position: relative;
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 7px 10px 3px 14px;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--vscode-descriptionForeground);
	cursor: pointer;
}

.group:hover {
	color: var(--vscode-foreground);
}

.group:focus-visible {
	outline: 1px solid var(--vscode-focusBorder);
	outline-offset: -1px;
}

/* no transition here — the list does a full teardown/rebuild on every render, so a
   collapsed chevron is simply born rotated rather than animating into place */
.group .chevron {
	position: absolute;
	left: 1px;
	top: 50%;
	transform: translateY(-50%);
}

.group.collapsed .chevron {
	transform: translateY(-50%) rotate(-90deg);
}

.group .swatch {
	flex: 0 0 auto;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--swatch, transparent);
	border: 1px solid var(--vscode-descriptionForeground);
}

.group-name {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.group-count {
	flex: 0 0 auto;
	font-weight: 400;
	opacity: 0.7;
}

/* ── archived ───────────────────────────────────────────── */

/* archived rows are still readable, just clearly set aside. the category wash goes with
   them — colour is a working signal and these aren't being worked on */
.row.archived {
	opacity: 0.55;
	background: none;
}

.row.archived:hover {
	opacity: 0.85;
	background: var(--vscode-list-hoverBackground);
}

.row.archived .dot {
	opacity: 0.4;
}

/* the count of what's hidden, and the way back to it */
.footer {
	display: block;
	width: 100%;
	text-align: left;
	padding: 8px 10px 10px 14px;
	font-size: 11px;
	color: var(--vscode-descriptionForeground);
}

.footer:hover {
	color: var(--vscode-textLink-foreground, var(--vscode-foreground));
	text-decoration: underline;
}

/* ── menus ──────────────────────────────────────────────── */

.popover .menu-label {
	padding: 4px 6px 2px;
	font-size: 10px;
	font-weight: 600;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--vscode-descriptionForeground);
}

/* fixed width so labels don't shift sideways as the tick comes and goes */
.popover .tick {
	flex: 0 0 auto;
	width: 10px;
	font-size: 11px;
	text-align: center;
	color: var(--vscode-foreground);
}

/* an entry that isn't a category has nothing to swatch, and a hollow circle beside
   'Archive' reads as an unset radio button */
.popover button.plain .swatch,
.popover button.danger .swatch {
	border-color: transparent;
}

.popover button.danger {
	color: var(--vscode-errorForeground, var(--vscode-foreground));
}

.popover button.danger:hover {
	background: var(--vscode-inputValidation-errorBackground, var(--vscode-list-hoverBackground));
	color: var(--vscode-errorForeground, var(--vscode-foreground));
}


html, body { margin: 0; padding: 0; }
body {
	width: 1100px;
	font-family: -apple-system, "Segoe UI", sans-serif;
	background: #101014;
	background-image: radial-gradient(120% 90% at 50% 0%, #1c1c24 0%, #0d0d10 70%);
}
.sheet {
	display: grid;
	grid-template-columns: repeat(3, 340px);
	gap: 18px;
	padding: 22px;
	justify-content: start;
}
.pane {
	margin: 0;
	width: 340px;
	--vscode-font-family: -apple-system, "Segoe UI", sans-serif;
	--vscode-font-size: 13px;
}
.pane .host {
	position: relative;
	overflow: hidden;
	border-radius: 8px;
	box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
}

/* a pane is a fixed window onto a scrolling list, so something is always half-cut at the
   bottom. fading it says 'there is more' instead of 'the render broke' */
.pane .host::after {
	content: "";
	position: absolute;
	inset: auto 0 0 0;
	height: 46px;
	pointer-events: none;
	background: linear-gradient(transparent, var(--vscode-sideBar-background));
}
.pane figcaption {
	padding: 9px 2px 0;
	font-size: 12px;
	letter-spacing: 0.01em;
	color: #8b8b96;
}
#pane-grouped .host { height: 720px; } #pane-settings .host { height: 720px; } #pane-categories .host { height: 720px; } #pane-sort .host { height: 470px; } #pane-rowmenu .host { height: 470px; } #pane-buttons .host { height: 470px; }

/* a lifted menu clone lives on the body, outside every .pane, so it has to carry the
   theme itself or it paints with no background at all */
.pane.dark, .shot-dark { --vscode-foreground:#cccccc;--vscode-descriptionForeground:#9d9d9d;--vscode-sideBar-background:#181818;--vscode-sideBarSectionHeader-border:#2b2b2b;--vscode-list-hoverBackground:#2a2d2e;--vscode-list-activeSelectionBackground:#04395e;--vscode-list-activeSelectionForeground:#ffffff;--vscode-inputOption-activeBackground:#0078d44d;--vscode-inputOption-activeBorder:#0078d4;--vscode-inputOption-activeForeground:#ffffff;--vscode-menu-background:#1f1f1f;--vscode-menu-foreground:#cccccc;--vscode-menu-border:#454545;--vscode-menu-selectionBackground:#0078d4;--vscode-menu-separatorBackground:#454545;--vscode-input-background:#313131;--vscode-input-border:#3c3c3c;--vscode-dropdown-background:#313131;--vscode-dropdown-border:#3c3c3c;--vscode-errorForeground:#f85149;--vscode-textLink-foreground:#4daafc;--vscode-focusBorder:#0078d4;--vscode-inputValidation-warningBackground:#352A05;--vscode-inputValidation-warningBorder:#B89500; }
.pane.dark .host { background: #181818; color: #cccccc; }
.pane.light, .shot-light { --vscode-foreground:#3b3b3b;--vscode-descriptionForeground:#767676;--vscode-sideBar-background:#f8f8f8;--vscode-sideBarSectionHeader-border:#e5e5e5;--vscode-list-hoverBackground:#e8e8e8;--vscode-list-activeSelectionBackground:#0060c0;--vscode-list-activeSelectionForeground:#ffffff;--vscode-inputOption-activeBackground:#005fb826;--vscode-inputOption-activeBorder:#005fb8;--vscode-inputOption-activeForeground:#000000;--vscode-menu-background:#ffffff;--vscode-menu-foreground:#3b3b3b;--vscode-menu-border:#cecece;--vscode-menu-selectionBackground:#005fb8;--vscode-menu-separatorBackground:#d4d4d4;--vscode-input-background:#ffffff;--vscode-input-border:#cecece;--vscode-dropdown-background:#ffffff;--vscode-dropdown-border:#cecece;--vscode-errorForeground:#c72e0f;--vscode-textLink-foreground:#005fb8;--vscode-focusBorder:#005fb8;--vscode-inputValidation-warningBackground:#F6F5D2;--vscode-inputValidation-warningBorder:#B89500; }
.pane.light .host { background: #f8f8f8; color: #3b3b3b; }

/* the real popover is clamped to the webview's own width. here it gets clamped to its
   pane instead, which is the same thing at the same size */
.popover { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
</style>

	function relativeTime(timestamp, now) {
		const seconds = Math.max(0, Math.round((now - timestamp) / 1000));
		if (seconds < 60) { return seconds + 's ago'; }
		const minutes = Math.round(seconds / 60);
		if (minutes < 60) { return minutes + 'm ago'; }
		const hours = Math.round(minutes / 60);
		if (hours < 24) { return hours + 'h ago'; }
		return Math.round(hours / 24) + 'd ago';
	}
